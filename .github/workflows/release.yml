name: Release

# Une étiquette « v1.2.3 » poussée sur GitHub publie la version : tests, archive, puis une page « Releases » avec le
# .zip à télécharger. L'étiquette doit correspondre à la version de manifest.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Étiquette = version du manifeste
        run: test "v$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME"
      - name: Tests
        run: npm test
      - name: Archive
        run: npm run build
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
