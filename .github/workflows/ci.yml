name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version de Node
        run: node --version
      - name: Tests
        run: npm test
      - name: Manifeste valide et archive
        run: npm run build
