<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>WikiMastered</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; width: 300px; background: #111118; color: #e5e7eb; font: 13px/1.45 system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #ffffff14; }
    header img { width: 20px; height: 20px; }
    header small { margin-left: auto; color: #9ca3af; }
    main { padding: 10px 12px; }
    p { margin: 0 0 6px; }
    .muted { color: #9ca3af; font-size: 12px; }
    .trade { padding: 6px 8px; border-radius: 6px; background: #fde68a14; color: #fde68a; }
    button { margin: 4px 0 8px; padding: 4px 10px; border-radius: 6px; border: 1px solid #fde68a66;
      background: #fde68a14; color: #fde68a; font: inherit; cursor: pointer; }
    label { display: block; margin: 6px 0; }
    .pulls { margin: 8px 0; padding: 6px 8px; border-radius: 6px; background: #ffffff0a; }
    a { color: #fde68a; }
    #shared, #settings { padding: 0 12px 10px; }
    select.small-select { padding: 1px 4px; border-radius: 4px; border: 1px solid #ffffff26; background: #1b1b24;
      color: inherit; font: inherit; }
    input.small { width: 3.5em; margin: 0 2px; padding: 1px 4px; border-radius: 4px; border: 1px solid #ffffff26;
      background: #ffffff0a; color: inherit; font: inherit; }
    #shared input[type=url], #shared input[type=password] { box-sizing: border-box; width: 100%; margin: 3px 0;
      padding: 4px 6px; border-radius: 6px; border: 1px solid #ffffff26; background: #ffffff0a; color: inherit; font: inherit; }
  </style>
</head>
<body>
  <header><img src="../icons/icon-32.png" alt=""><b>WikiMastered · prix</b><small id="version"></small></header>
  <main id="main"><p class="muted">Lecture de la page…</p></main>
  <section id="settings"></section>
  <section id="shared"></section>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
