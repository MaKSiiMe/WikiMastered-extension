<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>WikiMastered</title>
  <style>
    /* DA de wiki-masters.com : ses couleurs (variables --color-* de son CSS), ses polices (Inter pour le texte, Outfit pour
       les titres, embarquées dans src/fonts, licence OFL), ses coins arrondis et les couleurs de ses raretés. Le thème
       clair ou sombre suit celui du site (src/content.js le relève). */
    @font-face { font-family: Inter; src: url(fonts/inter-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: Outfit; src: url(fonts/outfit-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
    :root { color-scheme: dark;
      --bg: #0c0d0c; --surface: #131615; --surface-2: #1b1f1d; --border: #2e3431; --fg: #f2f4f3; --muted: #9aa69f;
      --accent: #34d399; --accent-light: #6ee7b7; --accent-fg: #0f172a; --wb: #fee685; --danger: #f87171; --warn: #ffb96d; --info: #90c5ff;
      --r-c: #b8f2d5; --r-pc: #b1cff2; --r-r: #c6a7f2; --r-sr: #ed6fa3; --r-ur: #fa9931; --r-l: #ffe144; }
    html.light { color-scheme: light;
      --bg: #f7f8f7; --surface: #eef1ef; --surface-2: #e4e8e5; --border: #b4bfb8; --fg: #0f172a; --muted: #55615b;
      --accent: #009767; --accent-light: #007956; --accent-fg: #ffffff; --wb: #b75000; --danger: #dc2626; --warn: #b75000; --info: #155dfc; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 Inter, system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    header img { width: 22px; height: 22px; }
    header b { font: 700 16px/1 Outfit, system-ui, sans-serif; letter-spacing: -0.01em; }
    header small { margin-left: auto; color: var(--muted); }
    #news { margin: 0; position: relative; }
    #news.dot::after { content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    nav#tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5;
      background: var(--bg); }
    nav#tabs button { flex: 1 0 auto; padding: 5px 8px; border: 0; border-radius: 8px; background: none; color: var(--muted);
      font: 500 12px/1.4 Inter, system-ui, sans-serif; cursor: pointer; }
    nav#tabs button:hover { color: var(--fg); background: var(--surface-2); }
    nav#tabs button[aria-selected="true"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }
    main { padding: 10px 12px 16px; }
    p { margin: 0 0 6px; }
    a { color: var(--accent); }
    label { display: block; margin: 6px 0; }
    label.inline { display: inline-block; margin: 4px 10px 4px 0; }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
    .muted { color: var(--muted); font-size: 12px; }
    .warn { color: var(--warn); }
    .new { color: var(--info); font-weight: 600; }
    .error { color: var(--danger); }
    .good { color: var(--accent); }
    .big { margin: 2px 0 4px; font: 700 22px/1.2 Outfit, system-ui, sans-serif; color: var(--wb); }
    .trade { padding: 6px 8px; border-radius: 8px; background: color-mix(in srgb, var(--wb) 10%, transparent); color: var(--wb); }
    .box { margin: 8px 0; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
    h3 { margin: 14px 0 6px; font: 600 14px/1.3 Outfit, system-ui, sans-serif; color: var(--fg); }
    .box > h3:first-child { margin-top: 2px; }
    h4 { margin: 10px 0 2px; font: 600 12px/1.3 Outfit, system-ui, sans-serif; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
    button.act { margin: 4px 0 8px; padding: 4px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font: 600 12px/1.5 Inter, system-ui, sans-serif; cursor: pointer; }
    button.act:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    button.act.small { margin: 0 0 0 4px; padding: 1px 8px; }
    button.act:disabled { opacity: 0.5; cursor: default; }
    input.small { width: 3.5em; margin: 0 2px; }
    input.wide { box-sizing: border-box; width: 100%; margin: 3px 0; }
    input.wide-small { width: 9em; }
    select.wide { box-sizing: border-box; width: 100%; }
    input.small, input.wide, select { padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: inherit; font: inherit; }
    input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    table { width: 100%; border-collapse: collapse; margin: 6px 0 10px; }
    th, td { padding: 4px; text-align: left; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    svg.spark { width: 100%; height: 40px; display: block; margin: 4px 0; }
    .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 4px 0; }
    .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
    table.rates td { vertical-align: middle; }
    td.bar-cell { width: 55%; }
    td.bar-cell .bar { margin: 0; }
    tr.sell td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
    /* Rareté en pastille, aux couleurs du site. */
    .rar { display: inline-block; min-width: 1.6em; padding: 0 5px; border-radius: 5px; text-align: center; color: #0c0d0c; background: var(--muted);
      font: 700 11px/1.55 Outfit, system-ui, sans-serif; white-space: nowrap; }
    .r-c { background: var(--r-c); } .r-pc { background: var(--r-pc); } .r-r { background: var(--r-r); }
    .r-sr { background: var(--r-sr); } .r-ur { background: var(--r-ur); } .r-l { background: var(--r-l); }
    /* Étiquettes choisies (Filtres). */
    .chip { display: inline-flex; align-items: center; gap: 2px; margin: 2px 4px 2px 0; padding: 1px 4px 1px 9px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface-2); font-size: 12px; }
    .chip button { border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; padding: 0 4px; }
    .chip button:hover { color: var(--danger); }
    /* « i » : détail au survol. */
    .info { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; margin-left: 5px; vertical-align: 1px;
      border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font: 600 10px/1 Outfit, system-ui, sans-serif; cursor: help; }
    /* Deux sous-onglets (Enchères : Achat / Vente). */
    .seg { display: flex; gap: 2px; padding: 3px; margin: 0 0 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
    .seg button { flex: 1; padding: 5px 0; border: 0; border-radius: 8px; background: none; color: var(--muted); font: 600 13px/1.4 Outfit, system-ui, sans-serif; cursor: pointer; }
    .seg button.on { background: var(--accent); color: var(--accent-fg); }
    .tag-lead { color: var(--accent); font-weight: 600; } .tag-out { color: var(--danger); font-weight: 600; }
    .modal-wrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 12px; background: #000000b3; }
    .modal { max-width: 420px; max-height: 100%; overflow: auto; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
    .modal h3 { margin-top: 0; }
    .modal .row { display: flex; justify-content: flex-end; gap: 8px; }
    .modal .row button.act { margin: 6px 0 0; }
  </style>
</head>
<body>
  <header><img src="../icons/icon-32.png" alt=""><b>WikiMastered</b><small id="version"></small><button id="news" class="act small">Nouveautés</button></header>
  <nav id="tabs"></nav>
  <main id="main"><p class="muted">Lecture…</p></main>
  <script src="lib.js"></script>
  <script src="news.js"></script>
  <script src="panel.js"></script>
</body>
</html>
