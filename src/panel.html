<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>WikiMastered</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #111118; color: #e5e7eb; font: 13px/1.45 system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #ffffff14; }
    header img { width: 20px; height: 20px; }
    header small { margin-left: auto; color: #9ca3af; }
    #news { margin: 0; position: relative; }
    #news.dot::after { content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
    nav { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid #ffffff14; position: sticky; top: 0; background: #111118; }
    nav button { flex: 1 0 auto; padding: 6px 0; border: 0; border-bottom: 2px solid transparent; background: none; color: #9ca3af;
      font: inherit; font-size: 12px; cursor: pointer; }
    nav button[aria-selected="true"] { color: #fde68a; border-bottom-color: #fde68a; }
    main { padding: 10px 12px; }
    p { margin: 0 0 6px; }
    label { display: block; margin: 6px 0; }
    label.inline { display: inline-block; margin: 4px 10px 4px 0; }
    .muted { color: #9ca3af; font-size: 12px; }
    .warn { color: #fdba74; }
    .new { color: #60a5fa; font-weight: 600; }
    .error { color: #fca5a5; }
    .big { font-size: 18px; font-weight: 700; color: #fde68a; }
    .trade { padding: 6px 8px; border-radius: 6px; background: #fde68a14; color: #fde68a; }
    .box { margin: 8px 0; padding: 6px 8px; border-radius: 6px; background: #ffffff0a; }
    button.act { margin: 4px 0 8px; padding: 4px 10px; border-radius: 6px; border: 1px solid #fde68a66; background: #fde68a14;
      color: #fde68a; font: inherit; cursor: pointer; }
    button.act.small { margin: 0 0 0 4px; padding: 1px 8px; }
    button.act:disabled { opacity: 0.5; cursor: default; }
    input.small { width: 3.5em; margin: 0 2px; }
    input.wide { box-sizing: border-box; width: 100%; margin: 3px 0; }
    input.wide-small { width: 9em; }
    input.small, input.wide, select { padding: 2px 6px; border-radius: 6px; border: 1px solid #ffffff26; background: #1b1b24; color: inherit; font: inherit; }
    table { width: 100%; border-collapse: collapse; margin: 6px 0 10px; }
    th, td { padding: 3px 4px; text-align: left; border-bottom: 1px solid #ffffff0f; vertical-align: top; }
    th { color: #9ca3af; font-weight: 500; font-size: 12px; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    h3 { margin: 12px 0 4px; font-size: 13px; color: #fde68a; }
    svg.spark { width: 100%; height: 40px; display: block; margin: 4px 0; }
  </style>
</head>
<body>
  <header><img src="../icons/icon-32.png" alt=""><b>WikiMastered</b><small id="version"></small><button id="news" class="act small">Nouveautés</button></header>
  <nav id="tabs"></nav>
  <main id="main"><p class="muted">Lecture…</p></main>
  <script src="lib.js"></script>
  <script src="news.js"></script>
  <script src="panel.js"></script>
</body>
</html>
